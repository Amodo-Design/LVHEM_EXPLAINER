server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /opt/presentation;
    index presentation.html;
    server_tokens off;
    autoindex off;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    # The asset filenames are stable between releases: revalidate instead of
    # retaining stale JavaScript after a Playground deployment.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}
