<!doctype html>
<html lang="en" data-presentation="iceberg"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI verification · Presentation</title>
<link rel="stylesheet" href="src/photo_callouts.css">
<link rel="preload" href="assets/fonts/ibm-plex-serif-regular-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'IBM Plex Serif';src:url('assets/fonts/ibm-plex-serif-regular-latin.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
.question-popup{position:fixed;z-index:2;left:clamp(24px,4vw,64px);bottom:94px;width:fit-content;max-width:min(490px,calc(100% - 48px));margin:0;padding:22px 28px;background:linear-gradient(110deg,rgb(246 242 232 / 72%),rgb(246 242 232 / 46%));color:#49463f;border:0;border-radius:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;text-align:left;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .6s,transform .6s,visibility 0s .6s}
.question-popup.is-visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}
.question-popup p{margin:0;font:400 clamp(24px,2.5vw,34px)/1.4 'IBM Plex Serif',Georgia,serif;letter-spacing:-.018em;text-wrap:balance}
@media(max-width:600px){.question-popup{left:20px;bottom:88px;padding:18px 22px;max-width:calc(100% - 40px)}.question-popup p{font-size:23px}}
@media(prefers-reduced-motion:reduce){.question-popup{transition:none}}

:root{color-scheme:light;background:#e8e9ec;color:#33374c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}.stage{position:fixed;inset:0}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.navigation{position:fixed;z-index:2;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:12px}button{display:grid;place-items:center;width:38px;height:38px;border:1px solid #8389a366;border-radius:50%;padding:0;background:#e8e9eceb;color:#33374c;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}button:hover:not(:disabled){background:#dcdfe7;border-color:#2d539e}button:focus-visible{outline:2px solid #2d539e;outline-offset:4px}button:disabled{opacity:.28;cursor:default}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}@media(prefers-reduced-motion:reduce){button{transition:none}}
/* Keep the dashboard mounted so responses, selections and scroll survive Back. */
.dashboard-overlay{position:fixed;z-index:3;inset:clamp(24px,5vh,60px) max(24px,5vw) 94px;max-width:1400px;margin-inline:auto;visibility:hidden;opacity:0;transform:translateY(18px) scale(.975);transform-origin:center bottom;pointer-events:none;transition:opacity .5s,transform .65s cubic-bezier(.2,.7,.2,1),visibility 0s .65s;filter:drop-shadow(0 18px 32px #262a3f30)}
.dashboard-overlay.is-visible{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition-delay:0s}
.dashboard-overlay iframe{display:block;width:100%;height:100%;border:0;border-radius:8px;background:transparent}
@media(max-width:600px){.dashboard-overlay{inset:16px 12px 84px}}
@media(prefers-reduced-motion:reduce){.dashboard-overlay{transition:none;transform:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<main id="stage" class="stage" aria-label="3D verification installation"></main>
<aside id="question-popup" class="question-popup" role="status" aria-hidden="true"><p>Is this data centre serving inference or training?</p></aside>
<section id="dashboard-overlay" class="dashboard-overlay" aria-label="Interactive recomputation dashboard" aria-hidden="true" inert>
<iframe id="dashboard-frame" title="Inference recomputation verification dashboard"></iframe>
</section>
<nav class="navigation" aria-label="Presentation navigation">
<button id="previous" aria-label="Previous view" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button>
<button id="next" aria-label="Next view"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button>
</nav>
<script type="module" src="src/install_viewer.js"></script>
</body></html>
